# Scrapes both deployment tracks independently so their golden-signal
# metrics can be compared side by side during a canary analysis window.
# See docs/deployment-strategy.md.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: stable
    static_configs:
      - targets: ["stable:8000"]
        labels:
          track: stable

  - job_name: canary
    static_configs:
      - targets: ["canary:8000"]
        labels:
          track: canary
