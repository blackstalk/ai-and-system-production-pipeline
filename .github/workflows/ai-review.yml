name: AI Review

# Contextual/architectural review layer, as described in
# docs/ai-review-strategy.md. Runs AFTER deterministic tooling (ci.yml,
# security.yml) so it never has to comment on formatting, typing, or
# lint issues those already own.
#
# Delegates to the standalone, stack-agnostic ai-review-action
# (github.com/blackstalk/ai-review-action) rather than embedding the
# review logic here — see ADR-005. That action is shared across
# multiple repos with different stacks; this repo just calls it and
# supplies its own customized prompt.
#
# This check is advisory when ANTHROPIC_API_KEY is not configured (e.g.
# on a fork PR that can't see repo secrets) — it skips gracefully rather
# than failing, per docs/adr/001-ai-review-is-not-authoritative.md.
# CRITICAL/HIGH findings fail this check when it does run; MEDIUM and
# below are informational only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: LLM-assisted diff review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI review
        uses: blackstalk/ai-review-action@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          base-ref: origin/${{ github.event.pull_request.base.ref }}
          exclude-paths: examples
          # This repo's prompt customizes the action's generic default
          # with references to its own deterministic tooling (ruff,
          # mypy, Bandit, pip-audit) and ADRs — see prompts/code-review.md.
          system-prompt-path: prompts/code-review.md
          fail-on-severity: CRITICAL,HIGH
