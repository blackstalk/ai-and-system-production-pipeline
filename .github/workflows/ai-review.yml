name: AI Review

# Contextual/architectural review layer, as described in
# docs/ai-review-strategy.md. Runs AFTER deterministic tooling (ci.yml,
# security.yml) so it never has to comment on formatting, typing, or
# lint issues those already own.
#
# This check is advisory when ANTHROPIC_API_KEY is not configured (e.g.
# on a fork PR that can't see repo secrets) — it skips gracefully rather
# than failing, per docs/adr/001-ai-review-is-not-authoritative.md.
# CRITICAL/HIGH findings fail this check when it does run; MEDIUM and
# below are informational only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: LLM-assisted diff review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Swap providers by changing this — see scripts/ai_review.py
          # and the Reviewer protocol for the extension point.
          AI_REVIEW_PROVIDER: anthropic
          AI_REVIEW_MODEL: claude-sonnet-5
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: python scripts/ai_review.py --output ai-review-comment.md

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ai-review-comment.md', 'utf8');
            const marker = '<!-- ai-review-bot -->';
            const commentBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
